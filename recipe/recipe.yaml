schema_version: 1

context:
  name: lhcbdirac-config

package:
  name: ${{ name|lower }}
  version: "2026.11.14"

build:
  number: 0
  noarch: generic

requirements:
  run:
    - ca-policy-lcg

tests:
  - script:
      - test -f "${CONDA_PREFIX}/etc/dirac.cfg"
      - echo "${X509_VOMS_DIR}"

about:
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Configuration package for LHCbDIRAC
  homepage: https://lhcb-dirac.readthedocs.io/

extra:
  recipe-maintainers:
    - chrisburr
